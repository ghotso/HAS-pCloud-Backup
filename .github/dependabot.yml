version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # requirements_test.txt only. The minimum-HA pins in .github/ci/ are intentionally
  # outside this directory and must only change together with hacs.json.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: test
    ignore:
      # Pinned by pytest-homeassistant-custom-component; separate bumps conflict.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      # 0.13.317+ (HA 2026.3+) needs Python 3.14 and aiohttp 3.14, which breaks
      # aioresponses 0.7.9 (pnuckowski/aioresponses#289). Hold until the tests
      # move to HA's aioclient_mock (#42) or aioresponses is fixed.
      - dependency-name: pytest-homeassistant-custom-component
        versions: [">=0.13.317"]
    groups:
      test-dependencies:
        patterns: ["*"]
