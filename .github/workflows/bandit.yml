# Bandit is a security linter for Python. Results are uploaded as SARIF and appear
# under the repository's Security tab (code scanning). It does not fail the build.
#
# https://github.com/marketplace/actions/bandit-scan is ISC licensed, by abirismyname
# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    branches: [main, dev]
  # Scan every pull request, regardless of its target branch.
  pull_request:
  schedule:
    - cron: "37 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout needs the token
      - name: Bandit Scan
        uses: shundor/python-bandit-scan@ab1d87dfccc5a0ffab88be3aaac6ffe35c10d6cd
        with:
          # Report findings in the Security tab instead of failing the build.
          exit_zero: true
          # The built-in token is enough to read PR information; no PAT needed.
          GITHUB_TOKEN: ${{ github.token }}
          # Scan only the integration; tests use `assert` by design (B101).
          path: custom_components
