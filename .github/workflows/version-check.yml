name: Version Check
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: Check Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs tags
          persist-credentials: false # nothing after checkout needs the token

      # hassfest already validates the version format. This only reminds maintainers
      # that merging without a version bump will not create a release (see release.yml).
      - name: Compare manifest version with latest release tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/pcloud_backup/manifest.json'))['version'])")
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          echo "manifest.json: $version, latest tag: ${latest:-none}"
          newest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)
          if [ -n "$latest" ] && { [ "$latest" = "$version" ] || [ "$newest" != "$version" ]; }; then
            echo "::warning file=custom_components/pcloud_backup/manifest.json::Version $version is not higher than the latest release v$latest - merging this PR will not create a release. Bump the version in manifest.json if this should be released."
          else
            echo "Merging will create release v$version."
          fi
