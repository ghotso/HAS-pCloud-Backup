name: Feature request
description: Suggest an idea or improvement for the HAS pCloud Backup integration.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the integration! Please check existing issues to avoid duplicates.
  - type: input
    id: contact
    attributes:
      label: Contact details
      description: How can we reach you if we need more details? (optional)
      placeholder: username on Discord, email, etc.
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Describe the feature
      description: Provide a clear and concise description of the feature or enhancement.
      placeholder: I would like the integration to...
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why is this valuable?
      description: Explain how this feature benefits users or solves a problem.
      placeholder: This helps because...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: extra_context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or references here.
    validations:
      required: false

