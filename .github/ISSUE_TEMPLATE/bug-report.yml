name: "Bug report 🐞"
description: "Found something broken? Help us squash it!"
title: "🐞 [Bug]: "
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏 Please review the existing issues before opening a new one.
  - type: textarea
    id: description
    attributes:
      label: What happened? 🤔
      description: Provide a clear and concise description of the problem.
      placeholder: When I try to start a backup...
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce 🧪
      description: List each step so we can reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior ✅
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots 📸
      description: Add screenshots or recordings if helpful. Drag & drop files here.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs 🧾
      description: Paste error traces or logs (remove sensitive info).
      render: shell
    validations:
      required: false
  - type: input
    id: integration_version
    attributes:
      label: Integration version 🔢
      description: Version of the HAS pCloud Backup integration you are using.
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version 🏠
      description: Version of Home Assistant where the issue occurs.
      placeholder: 2024.10.1
    validations:
      required: true
  - type: input
    id: install_method
    attributes:
      label: Installation method 🛠️
      description: How did you install this integration? (HACS, manual, etc.)
      placeholder: HACS
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context 💬
      description: Add any other context about the problem here.
    validations:
      required: false

